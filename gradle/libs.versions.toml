[versions]
agp = '9.5.0'
kotlin = '2.4.21'
ksp = '2.3.13'
hilt = '2.60.1'
foojay-resolver = '1.0.0'
compose-bom = '2026.09.00'
activity-compose = '1.13.0'
androidx-hilt = '1.4.0'
lifecycle = '2.11.0'
core-ktx = '1.19.1'
datastore = '1.3.0'
coroutines = '1.11.0'
coil = '3.6.3'
junit = '4.13.2'
turbine = '1.2.1'
compile-sdk = '37'
target-sdk = '36'
min-sdk = '29'
jvm-toolchain = '17'

[libraries]
compose-bom = { module = 'androidx.compose:compose-bom', version.ref = 'compose-bom' }
compose-foundation = { module = 'androidx.compose.foundation:foundation' }
compose-material3 = { module = 'androidx.compose.material3:material3' }
compose-material-icons-extended = { module = 'androidx.compose.material:material-icons-extended' }
compose-ui-tooling = { module = 'androidx.compose.ui:ui-tooling' }
compose-ui-tooling-preview = { module = 'androidx.compose.ui:ui-tooling-preview' }
activity-compose = { module = 'androidx.activity:activity-compose', version.ref = 'activity-compose' }
core-ktx = { module = 'androidx.core:core-ktx', version.ref = 'core-ktx' }
lifecycle-runtime-compose = { module = 'androidx.lifecycle:lifecycle-runtime-compose', version.ref = 'lifecycle' }
lifecycle-viewmodel-compose = { module = 'androidx.lifecycle:lifecycle-viewmodel-compose', version.ref = 'lifecycle' }
hilt-android = { module = 'com.google.dagger:hilt-android', version.ref = 'hilt' }
hilt-compiler = { module = 'com.google.dagger:hilt-compiler', version.ref = 'hilt' }
hilt-lifecycle-viewmodel-compose = { module = 'androidx.hilt:hilt-lifecycle-viewmodel-compose', version.ref = 'androidx-hilt' }
datastore-preferences = { module = 'androidx.datastore:datastore-preferences', version.ref = 'datastore' }
coroutines-android = { module = 'org.jetbrains.kotlinx:kotlinx-coroutines-android', version.ref = 'coroutines' }
coroutines-test = { module = 'org.jetbrains.kotlinx:kotlinx-coroutines-test', version.ref = 'coroutines' }
coil-compose = { module = 'io.coil-kt.coil3:coil-compose', version.ref = 'coil' }
junit = { module = 'junit:junit', version.ref = 'junit' }
turbine = { module = 'app.cash.turbine:turbine', version.ref = 'turbine' }

[bundles]
compose = ['compose-foundation', 'compose-material3', 'compose-material-icons-extended', 'compose-ui-tooling-preview', 'activity-compose', 'lifecycle-runtime-compose', 'lifecycle-viewmodel-compose', 'hilt-lifecycle-viewmodel-compose', 'coil-compose']

[plugins]
android-application = { id = 'com.android.application', version.ref = 'agp' }
android-library = { id = 'com.android.library', version.ref = 'agp' }
kotlin-compose = { id = 'org.jetbrains.kotlin.plugin.compose', version.ref = 'kotlin' }
ksp = { id = 'com.google.devtools.ksp', version.ref = 'ksp' }
hilt = { id = 'com.google.dagger.hilt.android', version.ref = 'hilt' }
foojay-resolver = { id = 'org.gradle.toolchains.foojay-resolver-convention', version.ref = 'foojay-resolver' }
